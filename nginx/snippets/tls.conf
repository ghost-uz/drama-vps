# ==============================================================================
# Umumiy TLS direktivalari — ssl.conf dagi HAR BIR `listen 443` bloki include
# qiladi (ilova bloki + domen-yo'naltirish bloklari).
#
# NEGA ALOHIDA SNIPPET: nginx'da `ssl_certificate` server bloklari orasida
# MEROS BO'LMAYDI — har bir 443 bloki uni o'zi e'lon qilishi shart. Domen
# ko'chishida yo'naltirish uchun yangi bloklar qo'shildi va sozlamalar uch
# joyda takrorlanmasin (bir joyda o'zgartirilib, boshqasida unutilmasin).
#
# DIQQAT: bu yerda FAQAT `server` konteksti direktivalari bo'lsin.
# ==============================================================================

# --- Cloudflare Origin CA sertifikati ---
# SAN ro'yxati IKKALA domenni qamrashi SHART: dramauz.com, *.dramauz.com,
# drama.uz, *.drama.uz. Aks holda Cloudflare "Full (strict)" rejimida
# qamralmagan domen uchun TLS handshake yiqiladi -> 525 xatosi.
ssl_certificate     /etc/nginx/certs/origin.pem;
ssl_certificate_key /etc/nginx/certs/origin.key;

# --- TLS sozlamalari ---
# TLSv1.0/1.1 yoqilmaydi (eskirgan). Cloudflare edge TLSv1.2+ ni qo'llaydi.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling ATAYLAB YOQILMAGAN: Origin CA sertifikatlarida OCSP
# responder yo'q -> yoqilsa nginx faqat xato log yozadi, foydasi yo'q.
