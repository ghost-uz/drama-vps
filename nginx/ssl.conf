# ==============================================================================
# dramauz.com — nginx PROD: TLS (443) Cloudflare Origin CA sertifikati bilan.
#
#   Foydalanuvchi --https--> Cloudflare --https(origin cert)--> nginx:443 --> web:8000
#
# Sertifikatlar serverda /opt/drama/nginx/certs/ da (gitignore'da!), konteynerga
# read-only mount qilinadi -> /etc/nginx/certs/. docker-compose.prod.yml bu
# faylni default.conf o'rniga mount qiladi.
#
# MUHIM: Origin CA sertifikati OMMAVIY ISHONCHLI EMAS — uni faqat Cloudflare
# taniydi. Shu sabab Cloudflare SSL rejimi "Full (strict)" bo'lishi SHART va
# saytga TO'G'RIDAN (IP orqali) kirilganda brauzer ogohlantirish beradi — bu
# kutilgan holat. Muddati 15 yil, renewal KERAK EMAS (Let's Encrypt'dan farqi).
#
# ------------------------------------------------------------------------------
# DOMEN KO'CHISHI (2026-07-30): drama.uz -> dramauz.com
#
#   dramafuz.com bloki       : ilova (default_server, quyida birinchi)
#   drama.uz / www.drama.uz  : 301 permanent -> dramauz.com (yo'l+query saqlanadi)
#   www.dramauz.com          : 301 permanent -> apex (kanonik xost bitta bo'lsin)
#
# Asosiy yo'naltirish Cloudflare edge'ida (Redirect Rule) bajariladi — bu
# bloklar ZAXIRA: CF qoidasi o'chirilsa yoki so'rov origin'ga to'g'ridan
# kelsa ham eski domen hech qachon 200 qaytarmasin. Ikkala domen bir vaqtda
# 200 qaytarishi — Google uchun aynan "duplikat/klon sayt" signali.
# ==============================================================================

upstream django {
    server web:8000 max_fails=0;
}

# HTTP (80): Full (strict) da Cloudflare origin bilan 443 orqali gaplashadi,
# shu sabab bu yerga asosan to'g'ridan-IP so'rovlar (skanerlar) tushadi.
server {
    listen 80 default_server;
    server_name _;

    # Host SHART: bo'lmasa nginx default `Host $proxy_host` = "django" yuboradi
    # va Django DisallowedHost -> 400 qaytaradi (snippets/app.conf'dagi izoh).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ATAYLAB yo'naltirilmaydi: TLS/Cloudflare buzilganda ham serverdan
    # `curl http://localhost/healthz` bilan app tirikligini tekshirish kerak.
    # (301 qaytsa `curl -f` uni "o'tdi" deb olardi => soxta-sog'lik —
    # prod.py SECURE_REDIRECT_EXEMPT dagi mantiqning xuddi o'zi.)
    location = /healthz {
        proxy_pass http://django;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Eski domen HTTP'da ham darhol yangi domenga (ortiqcha hop bo'lmasin:
# aks holda drama.uz:80 -> drama.uz:443 -> dramauz.com = 2 sakrash).
server {
    listen 80;
    server_name drama.uz www.drama.uz www.dramauz.com;
    return 301 https://dramauz.com$request_uri;
}

# ------------------------------------------------------------------------------
# ILOVA — kanonik xost (dramauz.com) va nomlanmagan so'rovlar (to'g'ridan IP,
# konteyner healthcheck'i). `default_server` ATAYLAB oshkor: quyidagi nomlangan
# yo'naltirish bloklari qo'shilgach, fallback ularga o'tib ketmasin —
# aks holda `curl https://localhost/healthz` 301 olardi va deploy health-gate
# soxta natija berardi.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/app.conf;
}

# ------------------------------------------------------------------------------
# ESKI DOMEN -> YANGI DOMEN (301 Moved Permanently)
#
# 301 (302 EMAS): faqat doimiy yo'naltirish reyting/backlink signallarini
# yangi manzilga o'tkazadi. `$request_uri` yo'l VA query'ni saqlaydi, ya'ni
# har bir eski URL o'zining aniq yangi juftiga tushadi (bosh sahifaga
# yig'ib yuborish — "soft 404" va reyting yo'qotish demakdir).
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name drama.uz www.drama.uz;

    include /etc/nginx/snippets/tls.conf;

    # Proxy sarlavhalari SERVER darajasida (app.conf'dagi izohning aynan
    # o'zi: location ichida bittasi bo'lsa, merosdagi HAMMASI yo'qoladi).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- O'TISH DAVRI ISTISNOLARI ---
    # Tashqi provayder callback'lari ATAYLAB yo'naltirilmaydi: 301 POST
    # so'rovni GET'ga aylantiradi va tanani tashlaydi -> to'lov tasdiqlash
    # yoki video-encoding signali JIMGINA yo'qoladi. Bu yo'llar qidiruv
    # tizimlari uchun ahamiyatsiz (GET'da 405 qaytaradi, indekslanmaydi),
    # shu bois duplikat-kontent riski yo'q.
    #
    # OLIB TASHLASH SHARTI: Bunny / Payme / Click / Telegram panellarida
    # callback URL dramauz.com'ga o'tkazilgach (docs/ops/domain-migration.md
    # §5 nazorat ro'yxati) bu uch location o'chiriladi.
    location ^~ /webhooks/ {
        proxy_pass http://django;
    }
    location ^~ /billing/click/ {
        proxy_pass http://django;
    }
    location = /billing/payme/webhook/ {
        proxy_pass http://django;
    }

    location / {
        return 301 https://dramauz.com$request_uri;
    }
}

# www -> apex: kanonik xost bitta bo'lishi shart (ikkalasi ham 200 qaytarsa
# bu ham duplikat-kontent). Eski domendan kelgan so'rov to'g'ridan apex'ga
# tushadi — www orqali ikkinchi sakrash yo'q.
server {
    listen 443 ssl;
    http2 on;
    server_name www.dramauz.com;

    include /etc/nginx/snippets/tls.conf;

    return 301 https://dramauz.com$request_uri;
}
